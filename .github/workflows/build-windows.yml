name: Build HUMKT Auto Buyer Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read application version
        id: app-version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($package.version)) {
            throw "package.json does not contain a valid version."
          }
          "version=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building installer for version $($package.version)"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows x64
        run: npm run dist:win

      - name: Verify installer exists
        shell: pwsh
        run: |
          $version = "${{ steps.app-version.outputs.version }}"
          $installer = "release/HUMKT-AutoBuyer-$version-x64.exe"
          if (!(Test-Path $installer)) {
            Write-Host "Release directory contents:"
            Get-ChildItem release | ForEach-Object { Write-Host $_.Name }
            throw "NSIS installer not found: $installer"
          }
          Write-Host "Installer ready: $installer"
          Write-Host "Size: $((Get-Item $installer).Length) bytes"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: HUMKT-AutoBuyer-V${{ steps.app-version.outputs.version }}-Windows-x64-Installer
          path: release/HUMKT-AutoBuyer-${{ steps.app-version.outputs.version }}-x64.exe
          if-no-files-found: error
          retention-days: 14
