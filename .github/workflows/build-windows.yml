
name: Build HUMKT Auto Buyer for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows x64
        run: npm run dist:win

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: HUMKT-AutoBuyer-V3.0-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
