name: Build HUMKT Auto Buyer for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read application version
        id: app-version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($package.version)) {
            throw "package.json does not contain a valid version."
          }
          "version=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Application version: $($package.version)"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows x64
        run: npm run dist:win

      - name: Verify generated EXE version
        shell: pwsh
        run: |
          $version = "${{ steps.app-version.outputs.version }}"
          $exeName = "HUMKT-AutoBuyer-$version-Portable-x64.exe"
          $exePath = Join-Path "release" $exeName

          if (!(Test-Path $exePath)) {
            Write-Host "Files found in release:"
            Get-ChildItem release | ForEach-Object { Write-Host $_.Name }
            throw "Expected EXE was not generated: $exeName"
          }

          $info = (Get-Item $exePath).VersionInfo
          Write-Host "EXE filename: $exeName"
          Write-Host "EXE FileVersion: $($info.FileVersion)"
          Write-Host "EXE ProductVersion: $($info.ProductVersion)"

          if (($info.FileVersion -notlike "$version*") -and ($info.ProductVersion -notlike "$version*")) {
            throw "EXE metadata does not match package.json version $version."
          }

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: HUMKT-AutoBuyer-V${{ steps.app-version.outputs.version }}-Windows-x64-Portable
          path: release/HUMKT-AutoBuyer-${{ steps.app-version.outputs.version }}-Portable-x64.exe
          if-no-files-found: error
          retention-days: 14
